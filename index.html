<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Background Remover</title>
<style>
  :root{
    --ink:#1b1b18;
    --paper:#faf9f6;
    --line:#dedad2;
    --accent:#3d5a4c;
    --accent-soft:#e7efe9;
    --danger:#a3402f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:560px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px;
  }
  h1{
    font-size:22px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  p.sub{
    margin:0 0 24px;
    color:#6b6a63;
    font-size:14px;
  }
  .drop{
    border:2px dashed var(--line);
    border-radius:10px;
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop:hover, .drop.drag{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .drop svg{margin-bottom:10px;}
  .drop-text{font-size:14px;color:#555;}
  .drop-text b{color:var(--ink);}
  input[type=file]{display:none;}
  .preview-row{
    display:flex;
    gap:16px;
    margin-top:24px;
  }
  .preview-box{
    flex:1;
    min-width:0;
  }
  .preview-box h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#8a8a82;
    margin:0 0 8px;
    font-weight:600;
  }
  .preview-frame{
    border:1px solid var(--line);
    border-radius:8px;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      linear-gradient(45deg,#eee 25%,transparent 25%),
      linear-gradient(-45deg,#eee 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eee 75%),
      linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0px;
  }
  .preview-frame img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  .status{
    margin-top:18px;
    font-size:13px;
    color:var(--accent);
    display:none;
    align-items:center;
    gap:8px;
  }
  .status.show{display:flex;}
  .spinner{
    width:14px;height:14px;
    border:2px solid var(--accent-soft);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error{
    margin-top:14px;
    font-size:13px;
    color:var(--danger);
    display:none;
  }
  .error.show{display:block;}
  .actions{
    margin-top:22px;
    display:flex;
    gap:10px;
  }
  button{
    flex:1;
    padding:12px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:14px;
    cursor:pointer;
    font-weight:500;
  }
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
    display:none;
  }
  button.primary.show{display:block;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.secondary:hover{border-color:var(--accent);}
</style>
</head>
<body>

<div class="card">
  <h1>Background Remover</h1>
  <p class="sub">Upload a photo, we'll strip the background, download the result. Runs entirely in your browser — nothing is uploaded anywhere.</p>

  <div class="drop" id="drop">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.6"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    <div class="drop-text"><b>Click to upload</b> or drag a photo here<br>PNG, JPG, WebP</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="status" id="status"><div class="spinner"></div><span id="statusText">Processing…</span></div>
  <div class="error" id="error"></div>

  <div class="preview-row" id="previewRow" style="display:none;">
    <div class="preview-box">
      <h3>Original</h3>
      <div class="preview-frame"><img id="origImg"></div>
    </div>
    <div class="preview-box">
      <h3>Result</h3>
      <div class="preview-frame"><img id="resultImg"></div>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" id="resetBtn">Start over</button>
    <button class="primary" id="downloadBtn">Download PNG</button>
  </div>
</div>

<script type="module">
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const errorEl = document.getElementById('error');
  const previewRow = document.getElementById('previewRow');
  const origImg = document.getElementById('origImg');
  const resultImg = document.getElementById('resultImg');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let resultBlob = null;
  let removeBackground = null;

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('drag');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  resetBtn.addEventListener('click', () => {
    fileInput.value = '';
    previewRow.style.display = 'none';
    downloadBtn.classList.remove('show');
    errorEl.classList.remove('show');
    drop.style.display = 'block';
  });

  downloadBtn.addEventListener('click', () => {
    if (!resultBlob) return;
    const url = URL.createObjectURL(resultBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'background-removed.png';
    a.click();
    URL.revokeObjectURL(url);
  });

  async function handleFile(file) {
    errorEl.classList.remove('show');
    origImg.src = URL.createObjectURL(file);
    previewRow.style.display = 'flex';
    resultImg.src = '';
    downloadBtn.classList.remove('show');
    statusEl.classList.add('show');
    statusText.textContent = 'Loading model (first run only)…';

    try {
      if (!removeBackground) {
        const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/index.mjs');
        removeBackground = mod.removeBackground;
      }
      statusText.textContent = 'Removing background…';
      resultBlob = await removeBackground(file, {
        progress: (key, current, total) => {
          statusText.textContent = `Processing… ${Math.round((current/total)*100)}%`;
        }
      });
      resultImg.src = URL.createObjectURL(resultBlob);
      downloadBtn.classList.add('show');
    } catch (err) {
      console.error(err);
      errorEl.textContent = 'Something went wrong processing that image: ' + (err?.message || 'unknown error') + '. Try a different photo, or check your connection (the model loads from a CDN on first use).';
      errorEl.classList.add('show');
    } finally {
      statusEl.classList.remove('show');
    }
  }
</script>

</body>
</html>
